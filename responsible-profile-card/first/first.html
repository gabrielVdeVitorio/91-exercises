<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <title>As cidades mais tecnológicas do Estado de São Paulo</title>
        <meta charset="UTF-8">
        <meta name="author" content="Gabriel Vitório dos Santos">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta http-equiv="X-UA-Compatible" content="IE=7">
        <meta name="keywords" content="Profile, Card, Link Tree">

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css">
        <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    </head>
    <body>
        <article id="profile-card" class="profile-card">
            <div id="profile">
                <section class="image card">
                    <img id="profile" class="profile-img profile-card" src="img/profile.jpeg" alt="profile-img">
                </section>
            
                <section class="info card">
                    <h1 class="name info">Gabriel Vitório dos Santos</h1>
                    <h2 class="job info">Web Developer</h2>
                </section>
            </div>
            <div id="footer">
                <section id="social-media" class="article__social-media __footer">
                    <a href="https://www.facebook.com" target="_blank" id="facebook" class="link article__social-media"><i class="bx bxl-facebook"></i></a>
                    <a href="https://www.instagram.com" target="_blank" id="instagram" class="link article__social-media"><i class="bx bxl-instagram"></i></a>
                    <a href="https://www.x.com" target="_blank" id="twitter" class="link article__social-media"><i class="bx bxl-twitter"></i></a>
                    <a href="https://www.youtube.com" target="_blank" id="youtube" class="link article__social-media"><i class="bx bxl-youtube"></i></a>
                    <a href="https://www.linkedin.com" target="_blank" id="linkedin" class="link article__social-media"><i class="bx bxl-linkedin"></i></a>
                </section>

                <section id="buttons" class="__footer">
                    <button class="button follow">Follow</button>
                    <button class="button message">Message</button>
                </section>

                <section id="analytics" class="__footer">
                    <div class="heart data">
                        <i class="bx bx-heart"></i>
                        <p> 60k</p>
                    </div>
                    <div class="message-balloon data">
                        <i class="bx bx-message-rounded"></i>
                        <p> 20k</p>
                    </div>
                    <div class="share data">
                        <i class="bx bx-share"></i>
                        <p> 12k</p>
                    </div>
                </section>
            
            </div>
        </article>
    </body>
</html>
