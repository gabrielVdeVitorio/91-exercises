<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Flipping Card in HTML and CSS</title>

        <meta charset="UTF-8">
        <meta name="title" content="Flipping Card in HTML and CSS">
        <meta name="author" content="Gabriel Vitório dos Santos">
        <meta name="description" content="A landing page with a flipping card design, made in HTML and CSS">
        <meta name="keywords" content="HTML, CSS, Flipping Card">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=7">
        <meta http-equiv="X-UA-Compatible" content="IE=Edge">

        <link rel="stylesheet" href="css/style.css">
        <link rel="shortcut icon" href="img/favicon.png" type="image/x-scale">
    </head>
    <body>
        <div class="container">
            <article id="card">
                <header>
                    <div id="mastercard">
                        <img src="img/logo.png" alt="mastercard logo">
                        <h5>Master Card</h5>
                    </div>
                </header>
                <main>
                    <div id="card-number">
                        <h6>Card Number</h6>
                        <h4>0000 0000 0000 8540</h4>
                    </div>
                    <img id="chip" src="img/chip.png" alt="Card chip image">
                </main>
                <footer>
                    <h5>Gabriel Vitório dos Santos</h5>
                    <div id="valid-date">
                        <h6>Valid Thru</h6>
                        <p>05/28</p>
                    </div>
                </footer>
            </article>
        </div>
    </body>
</html>
